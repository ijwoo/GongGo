# Greenhouse 채용 게시판 (키 없음). 회사를 더하려면 boards에 token(boards.greenhouse.io/{token})과 이름을 넣는다.
# homepage: 공고 페이지에 대표 이미지가 없을 때 대신 찾아볼 주소(쿠팡은 사이트가 봇 요청을 막아 비워 둠).
# 국내 근무지 + 개발 직군만 남긴다. 쿠팡처럼 공고가 많은 회사도 이 조건으로 수십 건 수준이 된다.
gonggo:
  greenhouse:
    enabled: ${GONGGO_GREENHOUSE_ENABLED:true}
    endpoint: https://boards-api.greenhouse.io/v1/boards
    location-pattern: "seoul|korea|서울|한국|pangyo|판교|seongnam|성남"
    title-pattern: "engineer|developer|개발|scientist|machine learning|\\bml\\b|\\bai\\b|\\bsre\\b|devops|data|backend|frontend|android|ios"
    boards:
      - { token: coupang, name: 쿠팡 }
      - { token: krafton, name: 크래프톤, homepage: "https://www.krafton.com" }
      - { token: daangn, name: 당근, homepage: "https://about.daangn.com" }
      - { token: furiosaai, name: 퓨리오사AI, homepage: "https://furiosa.ai" }
      - { token: moloco, name: 몰로코, homepage: "https://www.moloco.com" }
      - { token: sendbird, name: 센드버드, homepage: "https://sendbird.com" }
