# main에 push하면 Lightsail 서버로 배포한다 (web: Next.js standalone, api: Spring Boot jar)
# 서버의 배포 키는 ~/bin/gonggo-receive 만 실행할 수 있다. 교체·헬스체크·롤백은 그 스크립트가 한다.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build web (standalone)
        run: |
          # Docker 이미지는 next start를 쓰므로 standalone은 배포 빌드에서만 켠다
          sed -i 's|^  cacheComponents: true,|  output: "standalone",\n  cacheComponents: true,|' next.config.ts
          grep -q 'output: "standalone"' next.config.ts
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build api
        working-directory: backend
        run: ./gradlew -q bootJar -x test

      - name: Bundle
        run: |
          mkdir -p bundle
          cp -R .next/standalone bundle/web
          if [ -d public ]; then cp -R public bundle/web/; fi
          mkdir -p bundle/web/.next && cp -R .next/static bundle/web/.next/
          cp "$(ls backend/build/libs/*.jar | grep -v plain | head -1)" bundle/api.jar
          echo "${GITHUB_SHA::7}" > bundle/REVISION
          tar -czf bundle.tgz -C bundle .
          du -h bundle.tgz

      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          echo "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy -o IdentitiesOnly=yes "ubuntu@$HOST" < bundle.tgz
